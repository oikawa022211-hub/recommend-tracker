<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D4537E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="推し活家計簿">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="icon" href="icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <title>推し活家計簿</title>
  <style>
    :root {
      --pink:      #D4537E;
      --pink-dark: #A33D60;
      --green:     #1D9E75;
      --purple:    #7F77DD;
      --amber:     #BA7517;
      --bg:        #F5F5F7;
      --surface:   #FFFFFF;
      --text:      #111827;
      --text-sub:  #6B7280;
      --text-hint: #9CA3AF;
      --border:    rgba(0,0,0,0.08);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100svh; overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    #app { max-width: 430px; margin: 0 auto; min-height: 100svh; background: var(--bg); }

    /* ── ヘッダー ── */
    .header {
      position: sticky; top: 0; z-index: 30;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: env(safe-area-inset-top, 44px) 20px 14px;
    }
    .header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .header h1 .star { color: var(--pink); }
    .header-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

    /* ── コンテンツ ── */
    .content { padding: 16px 16px calc(68px + env(safe-area-inset-bottom, 16px) + 8px); }

    /* ── サマリーカード（合計のみ）── */
    .summary-card {
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%);
      color: white; border-radius: var(--radius-lg);
      padding: 22px 22px; margin-bottom: 14px;
    }
    .summary-label { font-size: 13px; opacity: .85; margin-bottom: 10px; }
    .summary-amount { font-size: 36px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .summary-count { font-size: 13px; opacity: .75; margin-top: 8px; }

    /* ── ホームカテゴリカード ── */
    .section-title { font-size: 13px; font-weight: 500; color: var(--text-sub); margin-bottom: 8px; }
    .cat-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border-radius: var(--radius-sm);
      padding: 13px 14px; margin-bottom: 8px;
      width: 100%; border: 1px solid transparent;
      cursor: pointer; text-align: left; font-family: inherit;
      transition: transform .12s, border-color .15s;
    }
    .cat-card:active { transform: scale(0.98); border-color: var(--border); }
    .cat-icon-box {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; flex-shrink: 0;
    }
    .cat-card-info { flex: 1; min-width: 0; }
    .cat-card-name { font-size: 14px; font-weight: 500; }
    .cat-card-count { font-size: 11px; color: var(--text-sub); margin-top: 1px; }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width .5s ease; }
    .cat-card-amount { font-size: 16px; font-weight: 700; flex-shrink: 0; }

    /* ── 詳細記録：カテゴリ → 月 → レコード ── */
    .detail-cat-section {
      background: var(--surface); border-radius: var(--radius-md);
      margin-bottom: 14px; overflow: hidden;
    }
    .detail-cat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
    }
    .detail-cat-left { display: flex; align-items: center; gap: 10px; }
    .detail-cat-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 19px;
    }
    .detail-cat-label { font-size: 15px; font-weight: 700; }
    .detail-cat-total { font-size: 16px; font-weight: 700; }

    .detail-month-group {}
    .detail-month-group + .detail-month-group { border-top: 1px solid var(--border); }
    .detail-month-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; background: var(--bg);
    }
    .detail-month-label { font-size: 12px; font-weight: 500; color: var(--text-sub); }
    .detail-month-total { font-size: 13px; font-weight: 700; }

    .detail-record {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px; border-top: 0.5px solid var(--border);
    }
    .detail-record-info { flex: 1; min-width: 0; }
    .detail-record-memo {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }
    .detail-record-date { font-size: 11px; color: var(--text-sub); margin-top: 1px; display: block; }
    .detail-record-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .detail-record-thumb {
      width: 32px; height: 32px; object-fit: cover;
      border-radius: 5px; cursor: pointer; border: 1px solid var(--border);
    }
    .detail-record-amount { font-size: 13px; font-weight: 700; }

    /* ── 履歴リスト ── */
    .month-label {
      font-size: 12px; font-weight: 500; color: var(--text-sub);
      margin: 16px 0 8px; letter-spacing: .04em;
    }
    .month-label:first-child { margin-top: 0; }
    .history-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border-radius: var(--radius-sm);
      padding: 11px 12px; margin-bottom: 6px;
    }
    .history-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .history-info { flex: 1; min-width: 0; }
    .history-memo { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-meta { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .history-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .history-thumb {
      width: 36px; height: 36px; object-fit: cover;
      border-radius: 6px; cursor: pointer; border: 1px solid var(--border);
    }
    .history-amount { font-size: 14px; font-weight: 700; margin-right: 2px; }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      color: var(--text-hint); padding: 5px; border-radius: 8px;
      font-size: 14px; line-height: 1; transition: color .15s, background .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-icon.edit:hover { color: var(--text-sub); background: var(--bg); }
    .btn-icon.del:hover  { color: #E24B4A; background: #FFF0F0; }

    /* ── 空状態 ── */
    .empty { text-align: center; padding: 48px 20px; color: var(--text-hint); }
    .empty .emoji { font-size: 44px; margin-bottom: 12px; }
    .empty p { font-size: 14px; line-height: 1.7; }

    /* ── ナビゲーション ── */
    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; z-index: 40;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-btn {
      flex: 1; padding: 10px 4px 8px; border: none; background: none;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-family: inherit; font-size: 10px; font-weight: 500; color: var(--text-hint);
      transition: color .15s;
    }
    .nav-btn.active { color: var(--pink); }
    .nav-btn svg { width: 22px; height: 22px; stroke-width: 2; }

    /* ── モーダル ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 50; display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-sheet {
      background: var(--surface); border-radius: 20px 20px 0 0;
      padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 430px; margin: 0 auto;
      max-height: 92svh; overflow-y: auto;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(0.32,0.72,0,1);
    }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }
    .modal-handle { display: flex; justify-content: center; padding: 10px 0 4px; }
    .modal-handle-bar { width: 36px; height: 4px; background: var(--border); border-radius: 2px; }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0 16px;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-cancel, .modal-ok {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 14px; padding: 4px 2px;
    }
    .modal-cancel { color: var(--text-sub); }
    .modal-ok { color: var(--pink); font-weight: 700; }

    /* ── フォーム ── */
    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 13px; font-weight: 500; color: var(--text-sub); display: block; margin-bottom: 7px; }
    .form-input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); font-family: inherit; font-size: 15px; color: var(--text);
      appearance: none; -webkit-appearance: none; transition: border-color .2s;
    }
    .form-input:focus { outline: none; border-color: var(--pink); background: var(--surface); }
    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cat-option {
      display: flex; align-items: center; gap: 7px;
      padding: 11px 12px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--bg);
      cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--text); transition: all .15s; user-select: none;
    }
    .cat-option:active { transform: scale(0.97); }
    .cat-option.selected { border-width: 2px; }
    .photo-upload-btn {
      width: 100%; padding: 12px; border-radius: var(--radius-sm);
      border: 1.5px dashed var(--border); background: var(--bg);
      font-family: inherit; font-size: 14px; color: var(--text-sub);
      cursor: pointer; transition: border-color .2s, color .2s;
    }
    .photo-upload-btn:hover { border-color: var(--pink); color: var(--pink); }
    .photo-preview { position: relative; }
    .photo-preview img {
      width: 100%; max-height: 200px; object-fit: cover;
      border-radius: var(--radius-sm); display: block; cursor: pointer;
    }
    .photo-remove {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,.55); color: white; border: none;
      border-radius: 50%; width: 24px; height: 24px; font-size: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-save {
      width: 100%; padding: 15px; background: var(--pink); color: white;
      border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: opacity .15s, transform .1s; margin-top: 4px;
    }
    .btn-save:active { opacity: .88; transform: scale(0.99); }

    /* ── 画像ビューア ── */
    .img-viewer {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s; padding: 20px;
    }
    .img-viewer.open { opacity: 1; pointer-events: all; }
    .img-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .img-viewer-close {
      position: absolute; top: calc(env(safe-area-inset-top,20px) + 12px); right: 16px;
      background: rgba(255,255,255,.2); color: white; border: none;
      border-radius: 50%; width: 36px; height: 36px; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* ── トースト ── */
    .toast {
      position: fixed; top: calc(env(safe-area-inset-top,44px) + 70px);
      left: 50%; transform: translateX(-50%) translateY(-8px);
      background: rgba(17,24,39,.92); color: white;
      padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500;
      opacity: 0; transition: all .25s ease; pointer-events: none;
      white-space: nowrap; z-index: 200; backdrop-filter: blur(8px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <h1><span class="star">★</span> 推し活家計簿</h1>
    <p class="header-sub" id="header-sub"></p>
  </header>
  <main class="content" id="content"></main>
  <nav class="nav">
    <button class="nav-btn" id="nav-home" onclick="setTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      ホーム
    </button>
    <button class="nav-btn" id="nav-detail" onclick="setTab('detail')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      詳細記録
    </button>
    <button class="nav-btn" id="nav-history" onclick="setTab('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      履歴
    </button>
  </nav>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<div class="img-viewer" id="img-viewer" onclick="closeImgViewer()">
  <button class="img-viewer-close" onclick="closeImgViewer()">✕</button>
  <img id="img-viewer-img" src="" alt="写真">
</div>

<input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhoto(this)">
<div class="toast" id="toast"></div>

<script>
  var CATS = [
    { id:'goods',  label:'グッズ',   emoji:'🎁', hex:'#D4537E', bg:'#FBF0F4' },
    { id:'travel', label:'遠征費',   emoji:'🚅', hex:'#1D9E75', bg:'#E8F7F2' },
    { id:'ticket', label:'チケット', emoji:'🎟️', hex:'#7F77DD', bg:'#F0EFFD' },
    { id:'sub',    label:'サブスク', emoji:'📺', hex:'#BA7517', bg:'#FEF4E4' },
  ];

  var APP = { tab:'home', expenses:[], form:null, editingId:null };

  function todayStr() { return new Date().toISOString().slice(0,10); }
  function catById(id) { return CATS.find(function(c){ return c.id===id; })||CATS[0]; }
  function fmt(n) { return Number(n).toLocaleString('ja-JP')+'円'; }
  function freshForm(catId) { return { date:todayStr(), category:catId||'goods', amount:'', memo:'', photo:null }; }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function loadExpenses() {
    try { APP.expenses = JSON.parse(localStorage.getItem('oshi-expenses')||'[]'); }
    catch(e) { APP.expenses = []; }
  }
  function saveExpenses() {
    try { localStorage.setItem('oshi-expenses', JSON.stringify(APP.expenses)); }
    catch(e) { toast('⚠ 保存に失敗しました'); }
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  function setTab(t) {
    APP.tab = t;
    ['home','detail','history'].forEach(function(id){
      var el = document.getElementById('nav-'+id);
      if(el) el.classList.toggle('active', id===t);
    });
    renderContent();
    window.scrollTo(0,0);
  }

  /* ── モーダル ── */
  function openModal(catId) {
    APP.editingId = null;
    APP.form = freshForm(catId);
    renderModal();
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(function(){ var f=document.getElementById('modal-amount'); if(f) f.focus(); }, 350);
  }
  function openEditModal(id) {
    var exp = APP.expenses.find(function(e){ return e.id===id; });
    if(!exp) return;
    APP.editingId = id;
    APP.form = { date:exp.date, category:exp.category, amount:String(exp.amount), memo:exp.memo||'', photo:exp.photo||null };
    renderModal();
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(function(){ var f=document.getElementById('modal-amount'); if(f) f.focus(); }, 350);
  }
  function handleOverlayClick(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  function renderModal() {
    var f = APP.form; if(!f) return;
    var isEdit = APP.editingId !== null;
    var catsHTML = CATS.map(function(c){
      var sel = f.category===c.id;
      var style = sel ? 'border-color:'+c.hex+';background:'+c.bg+';color:'+c.hex+';' : '';
      return '<button class="cat-option'+(sel?' selected':'')+'" style="'+style+'"'
        +' onclick="APP.form.category=\''+c.id+'\';renderModal();">'+c.emoji+' '+c.label+'</button>';
    }).join('');
    var photoHTML = f.photo
      ? '<div class="photo-preview"><img src="'+f.photo+'" alt="写真" onclick="viewModalPhoto()">'
        +'<button class="photo-remove" onclick="APP.form.photo=null;renderModal();">✕</button></div>'
      : '<button class="photo-upload-btn" onclick="document.getElementById(\'photo-input\').click()">📷 写真を追加</button>';

    document.getElementById('modal-sheet').innerHTML =
      '<div class="modal-handle"><div class="modal-handle-bar"></div></div>'
      +'<div class="modal-header">'
      +'<button class="modal-cancel" onclick="closeModal()">キャンセル</button>'
      +'<span class="modal-title">'+(isEdit?'記録を編集':'支出を記録')+'</span>'
      +'<button class="modal-ok" onclick="saveExpense()">保存</button>'
      +'</div>'
      +'<div class="form-group"><label class="form-label">カテゴリ</label><div class="cat-grid">'+catsHTML+'</div></div>'
      +'<div class="form-group"><label class="form-label">日付</label>'
      +'<input class="form-input" type="date" value="'+f.date+'" onchange="APP.form.date=this.value"></div>'
      +'<div class="form-group"><label class="form-label">金額（円）</label>'
      +'<input class="form-input" id="modal-amount" type="number" inputmode="numeric"'
      +' placeholder="例：3500" value="'+(f.amount||'')+'" oninput="APP.form.amount=this.value" min="1" step="1"></div>'
      +'<div class="form-group"><label class="form-label">メモ（任意）</label>'
      +'<input class="form-input" type="text" placeholder="例：〇〇ライブ遠征"'
      +' value="'+escHtml(f.memo)+'" oninput="APP.form.memo=this.value"></div>'
      +'<div class="form-group"><label class="form-label">レシート・写真（任意）</label>'+photoHTML+'</div>'
      +'<button class="btn-save" onclick="saveExpense()">'+( isEdit?'更新する ✓':'保存する ＋')+'</button>';
  }

  /* ── 写真 ── */
  function handlePhoto(input) {
    var file = input.files[0]; if(!file) return;
    compressImage(file).then(function(b64){ APP.form.photo=b64; renderModal(); });
    input.value = '';
  }
  function compressImage(file) {
    return new Promise(function(resolve){
      var r = new FileReader();
      r.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var MAX=800, w=img.width, h=img.height;
          if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
          var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          resolve(cv.toDataURL('image/jpeg',0.7));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });
  }
  function viewImg(src) { document.getElementById('img-viewer-img').src=src; document.getElementById('img-viewer').classList.add('open'); }
  function viewModalPhoto() { if(APP.form&&APP.form.photo) viewImg(APP.form.photo); }
  function viewImgById(id) { var e=APP.expenses.find(function(x){ return x.id===Number(id); }); if(e&&e.photo) viewImg(e.photo); }
  function closeImgViewer() { document.getElementById('img-viewer').classList.remove('open'); }

  /* ── 保存 ── */
  function saveExpense() {
    var f=APP.form, amt=Number(f.amount);
    if(!amt||amt<=0){ toast('⚠ 金額を入力してください'); var el=document.getElementById('modal-amount'); if(el) el.focus(); return; }
    if(APP.editingId!==null) {
      for(var i=0;i<APP.expenses.length;i++){
        if(APP.expenses[i].id===APP.editingId){
          APP.expenses[i].date=f.date; APP.expenses[i].category=f.category;
          APP.expenses[i].amount=amt; APP.expenses[i].memo=f.memo.trim(); APP.expenses[i].photo=f.photo||null;
          break;
        }
      }
      toast('✓ 更新しました！');
    } else {
      APP.expenses.unshift({ id:Date.now(), date:f.date, category:f.category, amount:amt, memo:f.memo.trim(), photo:f.photo||null });
      toast('✓ 記録しました！');
    }
    APP.editingId=null; saveExpenses(); closeModal(); renderContent();
  }

  /* ── 削除 ── */
  function delExpense(id) {
    if(!confirm('この記録を削除しますか？')) return;
    APP.expenses=APP.expenses.filter(function(e){ return e.id!==id; });
    saveExpenses(); renderContent(); toast('削除しました');
  }

  /* ── 統計 ── */
  function getStats(year) {
    var yr=APP.expenses.filter(function(e){ return e.date&&e.date.startsWith(String(year)); });
    var total=yr.reduce(function(s,e){ return s+e.amount; },0);
    var byCat=CATS.map(function(c){
      var items=yr.filter(function(e){ return e.category===c.id; });
      return { id:c.id,label:c.label,emoji:c.emoji,hex:c.hex,bg:c.bg,
               total:items.reduce(function(s,e){ return s+e.amount; },0), count:items.length };
    });
    return { yr:yr, total:total, byCat:byCat };
  }

  /* ── ホーム ── */
  function renderHome() {
    var year=new Date().getFullYear(), s=getStats(year);
    var maxT=Math.max.apply(null,s.byCat.map(function(c){ return c.total; }).concat([1]));
    var html='<div class="summary-card">'
      +'<div class="summary-label">★ '+year+'年の推し活合計</div>'
      +'<div class="summary-amount">'+fmt(s.total)+'</div>'
      +'<div class="summary-count">全'+s.yr.length+'件の記録</div>'
      +'</div>'
      +'<div class="section-title">カテゴリ別（タップして記録）</div>';
    s.byCat.forEach(function(c){
      var barW=Math.round(c.total/maxT*100);
      html+='<button class="cat-card" onclick="openModal(\''+c.id+'\')">'
        +'<div class="cat-icon-box" style="background:'+c.bg+';">'+c.emoji+'</div>'
        +'<div class="cat-card-info">'
        +'<div class="cat-card-name">'+c.label+'</div>'
        +'<div class="cat-card-count">'+c.count+'件</div>'
        +'<div class="progress-bar"><div class="progress-fill" style="width:'+barW+'%;background:'+c.hex+';"></div></div>'
        +'</div>'
        +'<div class="cat-card-amount" style="color:'+c.hex+';">'+fmt(c.total)+'</div></button>';
    });
    if(s.yr.length===0) html+='<div class="empty"><div class="emoji">✨</div><p>まだ記録がありません<br>カテゴリをタップして記録しよう！</p></div>';
    return html;
  }

  /* ── 詳細記録：カテゴリ→月→レコード ── */
  function renderDetail() {
    if(!APP.expenses.length) return '<div class="empty"><div class="emoji">📋</div><p>記録がありません</p></div>';
    var html='';
    CATS.forEach(function(c){
      var catExp=APP.expenses.filter(function(e){ return e.category===c.id; });
      if(!catExp.length) return;
      var catTotal=catExp.reduce(function(s,e){ return s+e.amount; },0);
      /* 月ごとにグループ化 */
      var monthMap={};
      catExp.forEach(function(e){
        var m=e.date.slice(0,7);
        if(!monthMap[m]) monthMap[m]=[];
        monthMap[m].push(e);
      });
      var months=Object.keys(monthMap).sort(function(a,b){ return b.localeCompare(a); });
      html+='<div class="detail-cat-section">'
        +'<div class="detail-cat-header">'
        +'<div class="detail-cat-left">'
        +'<div class="detail-cat-icon" style="background:'+c.bg+';">'+c.emoji+'</div>'
        +'<span class="detail-cat-label">'+c.label+'</span>'
        +'</div>'
        +'<span class="detail-cat-total" style="color:'+c.hex+';">'+fmt(catTotal)+'</span>'
        +'</div>';
      months.forEach(function(month){
        var items=monthMap[month].slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
        var mTotal=items.reduce(function(s,e){ return s+e.amount; },0);
        var pts=month.split('-');
        html+='<div class="detail-month-group">'
          +'<div class="detail-month-header">'
          +'<span class="detail-month-label">'+pts[0]+'年'+Number(pts[1])+'月</span>'
          +'<span class="detail-month-total" style="color:'+c.hex+';">'+fmt(mTotal)+'</span>'
          +'</div>';
        items.forEach(function(e){
          var thumbHTML=e.photo?'<img class="detail-record-thumb" src="'+e.photo+'" onclick="viewImgById('+e.id+')">':'';
          html+='<div class="detail-record">'
            +'<div class="detail-record-info">'
            +'<span class="detail-record-memo">'+escHtml(e.memo||c.label)+'</span>'
            +'<span class="detail-record-date">'+e.date+'</span>'
            +'</div>'
            +'<div class="detail-record-right">'
            +thumbHTML
            +'<span class="detail-record-amount" style="color:'+c.hex+';">'+fmt(e.amount)+'</span>'
            +'<button class="btn-icon edit" onclick="openEditModal('+e.id+')" title="編集">✏️</button>'
            +'<button class="btn-icon del"  onclick="delExpense('+e.id+')" title="削除">🗑️</button>'
            +'</div></div>';
        });
        html+='</div>';
      });
      html+='</div>';
    });
    return html||'<div class="empty"><div class="emoji">📋</div><p>記録がありません</p></div>';
  }

  /* ── 履歴 ── */
  function renderHistory() {
    if(!APP.expenses.length) return '<div class="empty"><div class="emoji">📋</div><p>記録がありません</p></div>';
    var sorted=APP.expenses.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    var lastMonth='', html='';
    sorted.forEach(function(e){
      var month=e.date.slice(0,7);
      if(month!==lastMonth){
        var pts=month.split('-');
        html+='<div class="month-label">'+pts[0]+'年'+Number(pts[1])+'月</div>';
        lastMonth=month;
      }
      var c=catById(e.category);
      var thumbHTML=e.photo?'<img class="history-thumb" src="'+e.photo+'" onclick="viewImgById('+e.id+')">':'';
      html+='<div class="history-item">'
        +'<div class="history-icon" style="background:'+c.bg+';">'+c.emoji+'</div>'
        +'<div class="history-info">'
        +'<div class="history-memo">'+escHtml(e.memo||c.label)+'</div>'
        +'<div class="history-meta">'+e.date+' · '+c.label+'</div>'
        +'</div>'
        +'<div class="history-right">'
        +thumbHTML
        +'<div class="history-amount" style="color:'+c.hex+';">'+fmt(e.amount)+'</div>'
        +'<button class="btn-icon edit" onclick="openEditModal('+e.id+')" title="編集">✏️</button>'
        +'<button class="btn-icon del"  onclick="delExpense('+e.id+')" title="削除">🗑️</button>'
        +'</div></div>';
    });
    return html;
  }

  function renderContent() {
    var el=document.getElementById('content'); if(!el) return;
    if(APP.tab==='home')        el.innerHTML=renderHome();
    else if(APP.tab==='detail') el.innerHTML=renderDetail();
    else                        el.innerHTML=renderHistory();
    var sub=document.getElementById('header-sub');
    if(sub) sub.textContent=new Date().getFullYear()+'年の推し活を記録しよう';
  }

  loadExpenses();
  document.getElementById('nav-home').classList.add('active');
  renderContent();

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
  }
</script>
</body>
</html>
